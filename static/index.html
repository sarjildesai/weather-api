<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-1: #4a90d2;
    --sky-2: #7ec0ee;
    --sky-3: #bfe0f7;
    --text: #ffffff;
    --text-dim: rgba(255,255,255,0.75);
    --glass: rgba(255,255,255,0.14);
    --glass-border: rgba(255,255,255,0.28);
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}

  html,body{
    height:100%;
    margin:0;
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Helvetica Neue", sans-serif;
  }

  body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    color:var(--text);
    background:linear-gradient(160deg, var(--sky-1) 0%, var(--sky-2) 55%, var(--sky-3) 100%);
    transition:background 1100ms ease;
    overflow-x:hidden;
    position:relative;
  }

  .orb{
    position:absolute;
    border-radius:50%;
    filter:blur(60px);
    opacity:0.35;
    pointer-events:none;
    transition:opacity 1100ms ease, background 1100ms ease;
  }
  .orb-1{ width:340px; height:340px; top:-80px; right:-60px; background:#ffffff; }
  .orb-2{ width:260px; height:260px; bottom:60px; left:-80px; background:#ffffff; opacity:0.2; }

  .topbar{
    width:100%;
    max-width:420px;
    padding:18px 20px 0;
    display:flex;
    justify-content:center;
    z-index:2;
  }

  .search-pill{
    display:flex;
    align-items:center;
    gap:8px;
    width:100%;
    background:var(--glass);
    border:1px solid var(--glass-border);
    backdrop-filter:blur(24px) saturate(160%);
    -webkit-backdrop-filter:blur(24px) saturate(160%);
    border-radius:20px;
    padding:10px 16px;
  }

  .search-pill svg{ flex:none; opacity:0.8; }

  .search-pill input{
    flex:1;
    background:none;
    border:none;
    outline:none;
    color:var(--text);
    font-family:inherit;
    font-size:15px;
    font-weight:400;
  }

  .search-pill input::placeholder{ color:var(--text-dim); }

  .search-pill button{
    background:none;
    border:none;
    color:var(--text);
    font-family:inherit;
    font-size:14px;
    font-weight:500;
    opacity:0.85;
    cursor:pointer;
    padding:2px 4px;
  }

  .search-wrap{
    position:relative;
    width:100%;
  }

  .suggestions{
    position:absolute;
    top:calc(100% + 6px);
    left:0;
    right:0;
    background:rgba(30,40,55,0.55);
    border:1px solid var(--glass-border);
    backdrop-filter:blur(24px) saturate(160%);
    -webkit-backdrop-filter:blur(24px) saturate(160%);
    border-radius:16px;
    overflow:hidden;
    z-index:5;
    display:none;
  }

  .suggestions.open{ display:block; }

  .suggestion-item{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    width:100%;
    padding:10px 16px;
    background:none;
    border:none;
    color:var(--text);
    font-family:inherit;
    text-align:left;
    cursor:pointer;
  }

  .suggestion-item + .suggestion-item{
    border-top:1px solid rgba(255,255,255,0.12);
  }

  .suggestion-item:hover,
  .suggestion-item.active{
    background:rgba(255,255,255,0.14);
  }

  .suggestion-item .s-name{
    font-size:14px;
    font-weight:500;
  }

  .suggestion-item .s-sub{
    font-size:11px;
    color:var(--text-dim);
    margin-top:1px;
  }

  main{
    flex:1;
    width:100%;
    max-width:420px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:24px 20px 40px;
    text-align:center;
    z-index:2;
  }

  .state-msg{
    font-size:15px;
    font-weight:400;
    color:var(--text-dim);
    line-height:1.6;
    max-width:280px;
  }

  .place{
    font-size:26px;
    font-weight:500;
    letter-spacing:-0.01em;
    margin:0 0 2px;
  }

  .country{
    font-size:13px;
    font-weight:400;
    color:var(--text-dim);
    margin:0 0 18px;
    text-transform:uppercase;
    letter-spacing:0.08em;
  }

  .temp-row{
    display:flex;
    align-items:flex-start;
    justify-content:center;
    gap:14px;
    margin-bottom:2px;
  }

  .icon{ width:64px; height:64px; margin-top:10px; }

  .temp{
    font-size:104px;
    font-weight:200;
    line-height:0.95;
    letter-spacing:-0.03em;
    margin:0;
  }

  .condition{
    font-size:19px;
    font-weight:400;
    color:var(--text-dim);
    margin:0 0 30px;
  }

  .glass-card{
    width:100%;
    background:var(--glass);
    border:1px solid var(--glass-border);
    backdrop-filter:blur(24px) saturate(160%);
    -webkit-backdrop-filter:blur(24px) saturate(160%);
    border-radius:20px;
    padding:16px 8px;
    display:flex;
  }

  .stat{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    padding:0 6px;
  }

  .stat + .stat{
    border-left:1px solid var(--glass-border);
  }

  .stat svg{ opacity:0.85; }

  .stat .label{
    font-size:11px;
    font-weight:500;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--text-dim);
  }

  .stat .value{
    font-size:17px;
    font-weight:500;
  }

  .unit-toggle{
    display:flex;
    align-items:center;
    gap:6px;
    background:rgba(255,255,255,0.10);
    border-radius:20px;
    padding:3px;
    flex:none;
    margin-top:10px;
    z-index:2;
  }

  .unit-toggle button{
    background:none;
    border:none;
    color:var(--text-dim);
    font-family:inherit;
    font-size:12px;
    font-weight:600;
    padding:5px 9px;
    border-radius:16px;
    cursor:pointer;
    transition:background 200ms ease, color 200ms ease;
  }

  .unit-toggle button.active{
    background:rgba(255,255,255,0.28);
    color:var(--text);
  }

  .recent-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
    margin-top:14px;
    max-width:320px;
  }

  .recent-chip{
    background:var(--glass);
    border:1px solid var(--glass-border);
    color:var(--text);
    font-family:inherit;
    font-size:12px;
    font-weight:500;
    padding:6px 12px;
    border-radius:14px;
    cursor:pointer;
  }

  .recent-chip:hover{
    background:rgba(255,255,255,0.24);
  }

  .go-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    min-width:30px;
  }

  .spinner{
    width:13px;
    height:13px;
    border-radius:50%;
    border:2px solid rgba(255,255,255,0.4);
    border-top-color:#ffffff;
    animation:spin-fast 0.7s linear infinite;
    display:none;
  }

  .go-btn.loading .go-label{ display:none; }
  .go-btn.loading .spinner{ display:inline-block; }

  @keyframes spin-fast{
    from{ transform:rotate(0deg); }
    to{ transform:rotate(360deg); }
  }

  footer{
    padding:14px;
    font-size:11px;
    color:var(--text-dim);
    z-index:2;
  }

  @keyframes float-a{
    0%,100%{ transform:translate(0,0); }
    50%{ transform:translate(6px,-8px); }
  }
  @keyframes float-b{
    0%,100%{ transform:translate(0,0); }
    50%{ transform:translate(-8px,6px); }
  }
  @keyframes spin-slow{
    from{ transform:rotate(0deg); }
    to{ transform:rotate(360deg); }
  }
  @keyframes drift-cloud{
    0%,100%{ transform:translateX(0); }
    50%{ transform:translateX(5px); }
  }
  @keyframes drop-fall{
    0%{ transform:translateY(-4px); opacity:0; }
    30%{ opacity:1; }
    100%{ transform:translateY(10px); opacity:0; }
  }

  .icon .sun-core{ animation:float-a 5s ease-in-out infinite; transform-origin:center; }
  .icon .sun-rays{ animation:spin-slow 50s linear infinite; transform-origin:center; }
  .icon .cloud-a{ animation:drift-cloud 6s ease-in-out infinite; }
  .icon .cloud-b{ animation:drift-cloud 7s ease-in-out infinite reverse; }
  .icon .drop{ animation:drop-fall 1s ease-in infinite; }
  .icon .drop:nth-child(2){ animation-delay:0.25s; }
  .icon .drop:nth-child(3){ animation-delay:0.5s; }

  @media (prefers-reduced-motion: reduce){
    .icon *{ animation:none !important; }
  }

  @media (max-width:380px){
    .temp{ font-size:88px; }
    .icon{ width:52px; height:52px; }
  }
</style>
</head>
<body>

<div class="orb orb-1" id="orb1"></div>
<div class="orb orb-2" id="orb2"></div>

<div class="topbar">
  <div class="search-wrap">
    <form class="search-pill" id="searchForm">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="cityInput" placeholder="Search for a city" autocomplete="off">
      <button type="submit" class="go-btn" id="goBtn">
        <span class="go-label">Go</span>
        <span class="spinner"></span>
      </button>
    </form>
    <div class="suggestions" id="suggestions"></div>
  </div>
</div>

<div class="unit-toggle" id="unitToggle">
  <button type="button" data-unit="c" class="active">°C</button>
  <button type="button" data-unit="f">°F</button>
</div>

<main id="main">
  <div id="content">
    <p class="state-msg">Search a city to see the current conditions.</p>
  </div>
  <div class="recent-row" id="recentRow"></div>
</main>

<footer>Live data via your local weather service</footer>

<script>
  const API_BASE = "http://localhost:5000";

  const bodyEl = document.body;
  const mainEl = document.getElementById('main');
  const contentEl = document.getElementById('content');
  const recentRowEl = document.getElementById('recentRow');
  const form = document.getElementById('searchForm');
  const cityInput = document.getElementById('cityInput');
  const goBtn = document.getElementById('goBtn');
  const orb1 = document.getElementById('orb1');
  const orb2 = document.getElementById('orb2');

  // ---- Unit toggle (°C / °F) ----
  let unit = 'c'; // 'c' or 'f'
  let lastData = null; // last rendered weather payload, so toggling re-renders without a refetch

  function cToF(c){ return (c * 9/5) + 32; }

  function displayTemp(tempC){
    const val = unit === 'f' ? cToF(tempC) : tempC;
    return `${Math.round(val)}°`;
  }

  document.getElementById('unitToggle').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-unit]');
    if (!btn) return;
    unit = btn.dataset.unit;
    document.querySelectorAll('.unit-toggle button').forEach(b => b.classList.toggle('active', b === btn));
    if (lastData) renderResult(lastData);
  });

  // ---- Recent searches (backed by /logs) ----
  async function loadRecent(){
    try {
      const res = await fetch(`${API_BASE}/logs`);
      if (!res.ok) return;
      const logs = await res.json();
      const seen = new Set();
      const recentCities = [];
      for (let i = logs.length - 1; i >= 0 && recentCities.length < 5; i--){
        const c = logs[i].city;
        if (c && !seen.has(c)){
          seen.add(c);
          recentCities.push(c);
        }
      }
      renderRecent(recentCities);
    } catch (err) {
      // silently ignore - recent searches are a nice-to-have
    }
  }

  function renderRecent(cities){
    if (!cities.length){
      recentRowEl.innerHTML = '';
      return;
    }
    recentRowEl.innerHTML = cities.map(c =>
      `<button type="button" class="recent-chip">${c}</button>`
    ).join('');
    recentRowEl.querySelectorAll('.recent-chip').forEach(btn => {
      btn.addEventListener('click', () => {
        cityInput.value = btn.textContent;
        lookup(btn.textContent);
      });
    });
  }

  // Apple-Weather-style gradients per Open-Meteo weather_code
  function skyFor(code){
    if (code === 0) {
      return { g:['#3d8fd6','#79c1ef','#c3e6fb'], label:'Clear', icon:'sun', orb:'#ffffff' };
    } else if (code >= 1 && code <= 3) {
      return { g:['#6f8296','#93a3b3','#c4cdd6'], label:'Partly Cloudy', icon:'cloud', orb:'#ffffff' };
    } else if (code === 45 || code === 48) {
      return { g:['#7c828c','#a3a8b0','#cdd0d4'], label:'Foggy', icon:'cloud', orb:'#ffffff' };
    } else if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) {
      return { g:['#33475a','#4c657c','#7690a4'], label:'Rain', icon:'rain', orb:'#dce8f2' };
    } else if (code >= 71 && code <= 77) {
      return { g:['#7f93a8','#a9bccd','#dbe6ef'], label:'Snow', icon:'cloud', orb:'#ffffff' };
    } else if (code >= 95) {
      return { g:['#232338','#3a3652','#544f74'], label:'Thunderstorms', icon:'rain', orb:'#c9c3e0' };
    }
    return { g:['#6f8296','#93a3b3','#c4cdd6'], label:'Cloudy', icon:'cloud', orb:'#ffffff' };
  }

  function iconSVG(kind){
    if (kind === 'sun') {
      return `<svg class="icon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <g class="sun-rays" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round">
          <line x1="32" y1="4" x2="32" y2="12"/>
          <line x1="32" y1="52" x2="32" y2="60"/>
          <line x1="4" y1="32" x2="12" y2="32"/>
          <line x1="52" y1="32" x2="60" y2="32"/>
          <line x1="12" y1="12" x2="18" y2="18"/>
          <line x1="46" y1="46" x2="52" y2="52"/>
          <line x1="12" y1="52" x2="18" y2="46"/>
          <line x1="46" y1="18" x2="52" y2="12"/>
        </g>
        <circle class="sun-core" cx="32" cy="32" r="14" fill="#ffffff"/>
      </svg>`;
    }
    if (kind === 'rain') {
      return `<svg class="icon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <ellipse class="cloud-a" cx="32" cy="24" rx="20" ry="12" fill="#ffffff"/>
        <g stroke="#ffffff" stroke-width="2.6" stroke-linecap="round">
          <line class="drop" x1="22" y1="42" x2="19" y2="52"/>
          <line class="drop" x1="32" y1="42" x2="29" y2="52"/>
          <line class="drop" x1="42" y1="42" x2="39" y2="52"/>
        </g>
      </svg>`;
    }
    return `<svg class="icon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
      <ellipse class="cloud-a" cx="27" cy="28" rx="18" ry="11" fill="#ffffff" opacity="0.9"/>
      <ellipse class="cloud-b" cx="39" cy="34" rx="14" ry="9" fill="#ffffff"/>
    </svg>`;
  }

  function humidityIcon(){
    return `<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C12 2 5 11 5 15.5C5 19.09 8.13 22 12 22C15.87 22 19 19.09 19 15.5C19 11 12 2 12 2Z"/></svg>`;
  }
  function windIcon(){
    return `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 8h11a3 3 0 1 0-3-3"/><path d="M3 16h15a3 3 0 1 1-3 3"/></svg>`;
  }

  function applySky(codeInfo){
    document.documentElement.style.setProperty('--sky-1', codeInfo.g[0]);
    document.documentElement.style.setProperty('--sky-2', codeInfo.g[1]);
    document.documentElement.style.setProperty('--sky-3', codeInfo.g[2]);
    orb1.style.background = codeInfo.orb;
    orb2.style.background = codeInfo.orb;
  }

  function showState(msg){
    contentEl.innerHTML = `<p class="state-msg">${msg}</p>`;
  }

  // Builds "State, Country" (or just "Country" if the location has no state/province,
  // e.g. city-states like Singapore)
  function locationLine(data){
    return data.state ? `${data.state}, ${data.country}` : `${data.country}`;
  }

  function renderResult(data){
    lastData = data;
    const s = skyFor(data.weather_code);
    applySky(s);

    contentEl.innerHTML = `
      <p class="place">${data.city}</p>
      <p class="country">${locationLine(data)}</p>
      <div class="temp-row">
        ${iconSVG(s.icon)}
        <p class="temp">${displayTemp(data.temperature_c)}</p>
      </div>
      <p class="condition">${s.label}</p>
      <div class="glass-card">
        <div class="stat">
          ${humidityIcon()}
          <span class="label">Humidity</span>
          <span class="value">${data.humidity_pct}%</span>
        </div>
        <div class="stat">
          ${windIcon()}
          <span class="label">Wind</span>
          <span class="value">${data.wind_speed_kmh} km/h</span>
        </div>
      </div>
    `;
  }

  async function lookup(city){
    showState(`Fetching conditions for ${city}…`);
    goBtn.classList.add('loading');
    goBtn.disabled = true;
    try {
      const res = await fetch(`${API_BASE}/weather/current?city=${encodeURIComponent(city)}`);
      if (!res.ok) {
        showState(`No results for "${city}". Check the spelling and try again.`);
        return;
      }
      const data = await res.json();
      renderResult(data);
      loadRecent();
    } catch (err) {
      showState(`Can't reach the weather service at ${API_BASE}. Make sure your server is running.`);
    } finally {
      goBtn.classList.remove('loading');
      goBtn.disabled = false;
    }
  }

  // Load recent searches on page load
  loadRecent();

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    closeSuggestions();
    const city = cityInput.value.trim();
    if (city) lookup(city);
  });

  // ---- Autocomplete ----
  const suggestionsEl = document.getElementById('suggestions');
  let debounceTimer = null;
  let currentSuggestions = [];
  let activeIndex = -1;

  function closeSuggestions(){
    suggestionsEl.classList.remove('open');
    suggestionsEl.innerHTML = '';
    currentSuggestions = [];
    activeIndex = -1;
  }

  function labelFor(s){
    return s.state ? `${s.name}, ${s.state}, ${s.country}` : `${s.name}, ${s.country}`;
  }

  function renderSuggestions(list){
    currentSuggestions = list;
    activeIndex = -1;
    if (!list.length){
      closeSuggestions();
      return;
    }
    suggestionsEl.innerHTML = list.map((s, i) => `
      <button type="button" class="suggestion-item" data-index="${i}">
        <span class="s-name">${s.name}</span>
        <span class="s-sub">${s.state ? s.state + ', ' : ''}${s.country || ''}</span>
      </button>
    `).join('');
    suggestionsEl.classList.add('open');

    suggestionsEl.querySelectorAll('.suggestion-item').forEach(btn => {
      btn.addEventListener('click', () => {
        const s = currentSuggestions[Number(btn.dataset.index)];
        selectSuggestion(s);
      });
    });
  }

  function selectSuggestion(s){
    cityInput.value = s.name;
    closeSuggestions();
    lookup(s.name);
  }

  async function fetchSuggestions(query){
    try {
      const res = await fetch(`${API_BASE}/geocode/suggestions?q=${encodeURIComponent(query)}`);
      if (!res.ok) { closeSuggestions(); return; }
      const data = await res.json();
      renderSuggestions(data.suggestions || []);
    } catch (err) {
      closeSuggestions();
    }
  }

  cityInput.addEventListener('input', () => {
    const query = cityInput.value.trim();
    clearTimeout(debounceTimer);
    if (query.length < 3){
      closeSuggestions();
      return;
    }
    debounceTimer = setTimeout(() => fetchSuggestions(query), 300);
  });

  cityInput.addEventListener('keydown', (e) => {
    if (!currentSuggestions.length) return;
    const items = suggestionsEl.querySelectorAll('.suggestion-item');

    if (e.key === 'ArrowDown'){
      e.preventDefault();
      activeIndex = Math.min(activeIndex + 1, currentSuggestions.length - 1);
      items.forEach((el, i) => el.classList.toggle('active', i === activeIndex));
    } else if (e.key === 'ArrowUp'){
      e.preventDefault();
      activeIndex = Math.max(activeIndex - 1, 0);
      items.forEach((el, i) => el.classList.toggle('active', i === activeIndex));
    } else if (e.key === 'Enter'){
      if (activeIndex >= 0){
        e.preventDefault();
        selectSuggestion(currentSuggestions[activeIndex]);
      }
    } else if (e.key === 'Escape'){
      closeSuggestions();
    }
  });

  document.addEventListener('click', (e) => {
    if (!e.target.closest('.search-wrap')) closeSuggestions();
  });
</script>

</body>
</html>
